name: litterlog-server

x-common-environment: &common-environment
  LITTERLOG_STATE_DIR: /var/lib/litterlog
  LITTERLOG_MEDIA_ROOT: /var/lib/litterlog/media
  LITTERLOG_DB: /var/lib/litterlog/events.sqlite3
  LITTERLOG_MODEL_DIR: /models
  LITTERLOG_CPU_THREADS: "2"
  TMPDIR: /tmp
  LITTERLOG_APP_TOKEN_FILE: /run/litterlog/app-token
  LITTERLOG_NVR_USER_FILE: /run/litterlog/protect-user
  LITTERLOG_NVR_PASS_FILE: /run/litterlog/protect-password
  LITTERLOG_CAMERA_NAME: Litter Box
  LITTERLOG_NVR_CA_CERT: /run/litterlog/protect-ca.pem
  LITTERLOG_PROTECT_ROUTING_DIR: /run/litterlog
  LITTERLOG_CHECKPOINT: video_24f_balanced

x-common: &common
  image: litterlog-server:local
  build:
    context: .
    dockerfile: Dockerfile
  entrypoint: [python, -u, /app/deploy/retained_logs.py]
  restart: unless-stopped
  init: true
  network_mode: host
  user: "1000:1000"
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=512m,mode=1777
  stop_grace_period: 45s
  logging:
    - driver: none

x-state-mount: &state-mount
  type: volume
  source: state
  target: /var/lib/litterlog
  volume:
    nocopy: true

x-config-mount: &config-mount
  type: volume
  source: config
  target: /run/litterlog
  read_only: true
  volume:
    nocopy: true

x-model-mount: &model-mount
  type: volume
  source: model
  target: /models
  read_only: true
  volume:
    nocopy: true

services:
  api:
    <<: *common
    command: [api]
    environment:
      <<: *common-environment
      LITTERLOG_BIND: 0.0.0.0
      LITTERLOG_PORT: 8443
      LITTERLOG_THUMBNAIL_WORKER: "0"
      WHISKER_EMAIL_FILE: /run/litterlog/whisker-email
      WHISKER_PASSWORD_FILE: /run/litterlog/whisker-password
      LITTERLOG_ROBOT_ID: ""
      LITTERLOG_TLS_CERT: /run/litterlog/server-chain.pem
      LITTERLOG_TLS_KEY: /run/litterlog/server.key
      LITTERLOG_SERVER_CA_CERT: /run/litterlog/server-ca.pem
    volumes:
      - *state-mount
      - *config-mount

  worker:
    <<: *common
    command: [worker, --backfill-days, "2"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *common-environment
      LITTERLOG_SERVER_URL: https://127.0.0.1:8443
      LITTERLOG_SERVER_CA_CERT: /run/litterlog/server-ca.pem
    healthcheck:
      disable: true
    volumes:
      - *state-mount
      - *config-mount
      - *model-mount

volumes:
  model:
    external: true
    name: litterlog-model
  state:
    external: true
    name: litterlog-state
  config:
    external: true
    name: litterlog-config
